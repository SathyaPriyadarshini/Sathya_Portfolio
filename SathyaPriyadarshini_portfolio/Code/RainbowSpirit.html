<title>Rainbow Spirit Festival | Brand Identity | Sathya Priyadarshini</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Noto+Sans+Tamil:wght@500;700&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: left-aligned editorial column. Big name, role-fit line, proof strip, work as ruled rows with a label column. One accent (teal). */
:root{
  --bg:#FFFBF5;--surface:#FFFFFF;--fg:#0F2236;--muted:#52606E;--rule:#EBDCCB;
  --accent:#B8530C;--accent-ink:#FFFFFF;--tag:#FBEBD9;--gold:#E9A00F;
  --font-display:"Poppins","Helvetica Neue",Arial,sans-serif;
  --font-body:"Poppins","Helvetica Neue",Arial,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0A1624;--surface:#101F31;--fg:#F4EDE3;--muted:#A9B6C4;--rule:#223650;--accent:#F0A63A;--accent-ink:#1A1000;--tag:#1B2F4A;--gold:#F0A63A;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0A1624;--surface:#101F31;--fg:#F4EDE3;--muted:#A9B6C4;--rule:#223650;--accent:#F0A63A;--accent-ink:#1A1000;--tag:#1B2F4A;--gold:#F0A63A;color-scheme:dark}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.65;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:980px;margin:0 auto;padding-block:28px 64px}
.mono{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* nav */
nav{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--rule)}
nav .brand{font-family:var(--font-display);font-weight:700;font-size:18px;text-decoration:none}
nav ul{display:flex;gap:20px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
nav ul a{font-size:14px;text-decoration:none;color:var(--muted)}
nav ul a:hover{color:var(--fg)}

/* hero */
.hero{padding-block:56px 40px}
.status{display:inline-flex;align-items:center;gap:10px;margin-bottom:24px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(38px,7vw,76px);line-height:1.05;letter-spacing:-.025em;margin:0 0 28px;text-wrap:balance}
h1 span{color:var(--accent)}
.lede{font-size:clamp(18px,2.4vw,22px);max-width:34em;margin:0 0 32px;color:var(--fg)}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:13px 26px;font-weight:600;font-size:15px;text-decoration:none;border:1.5px solid var(--fg);border-radius:999px;cursor:pointer;font-family:inherit;background:transparent;color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:hover{transform:translateY(-1px)}

/* proof strip */
.proof{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border-top:1px solid var(--fg);border-bottom:1px solid var(--rule);margin-block:40px 0}
.proof div{padding:20px 16px 20px 0}
.proof b{display:block;font-family:var(--font-display);font-size:26px;line-height:1.1;letter-spacing:-.02em}
.proof span{font-size:14px;color:var(--muted)}

/* sections */
section{padding-block:64px 0}
h2{font-family:var(--font-display);font-weight:600;font-size:clamp(26px,3.6vw,38px);letter-spacing:-.02em;line-height:1.25;margin:8px 0 28px;text-wrap:balance;background:linear-gradient(transparent 62%,var(--tag) 62%);display:inline;padding-inline:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
h2+*{margin-top:0}
section>h2{display:block;background:none;padding:0}
section>h2::after{content:"";display:block;width:84px;height:8px;border-radius:8px;background:var(--gold);margin-top:14px}
.fit{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.fit article{background:var(--tag);border-radius:16px;padding:24px}
.fit h3{font-family:var(--font-display);font-size:20px;margin:0 0 8px}
.fit p{margin:0;color:var(--muted);font-size:15.5px}

/* work rows */
.row{display:grid;grid-template-columns:180px minmax(0,1fr);gap:8px 32px;padding-block:28px;border-top:1px solid var(--rule)}
.row:last-child{border-bottom:1px solid var(--rule)}
.row .label{padding-top:4px}
.row h3{font-family:var(--font-display);font-size:26px;line-height:1.15;margin:0 0 10px;letter-spacing:-.01em}
.row p{margin:0 0 12px;max-width:40em}
.row ul{margin:0 0 14px;padding-left:18px;max-width:40em}
.row li{margin-bottom:4px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.tags li{font-family:var(--font-mono);font-size:11.5px;background:var(--tag);padding:4px 12px;border-radius:999px;margin:0;color:var(--fg)}
.award{display:inline-block;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);padding:3px 12px;border-radius:999px;margin-bottom:12px}

/* experience */
.exp .row h3{font-size:21px;margin-bottom:2px}
.exp .org{color:var(--muted);margin:0 0 10px}

/* skills */
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:28px 40px}
.skills h3{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:500}
.skills p{margin:0}

/* contact */
.contact{background:var(--accent);color:var(--accent-ink);padding:48px clamp(20px,4vw,56px);margin-top:64px;border-radius:24px}
.contact h2{margin-top:0;color:var(--accent-ink)}
.contact h2::after{background:var(--accent-ink)!important;opacity:.5}
.contact p{max-width:34em;margin:0 0 24px}
.contact dl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px 16px;align-items:center;margin:0;max-width:640px}
.contact dt{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.contact dd{margin:0;overflow-wrap:anywhere;font-weight:500}
.contact a{text-underline-offset:3px}
.copy{font-family:var(--font-mono);font-size:12px;padding:6px 12px;border:1px solid currentColor;background:transparent;color:inherit;border-radius:3px;cursor:pointer}
footer{padding-top:32px;color:var(--muted);font-size:13px}

/* visual-first */
.showcase{margin:8px 0 0;border-radius:18px;overflow:hidden;background:#0b3d73}
.duo{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-top:8px}.duo>*{grid-column:span 2}.duo>*:nth-child(n+4){grid-column:span 3}@media(max-width:900px){.duo>*,.duo>*:nth-child(n+4){grid-column:span 6}}
.duo .showcase{margin:0}
.duo .showcase.light{background:#fff;border:1px solid var(--rule)}
.showcase img{display:block;width:100%;height:auto}
.feature{display:block;text-decoration:none;margin-bottom:40px}
.feature .shot{border-radius:18px;overflow:hidden;background:#0b3d73;aspect-ratio:16/9}
.feature .shot img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.feature:hover .shot img{transform:scale(1.03)}
.feature .cap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:baseline;padding-top:14px}
.feature h3{font-family:var(--font-display);font-size:clamp(24px,3.4vw,34px);margin:0;letter-spacing:-.02em}
.feature p{margin:6px 0 0;color:var(--muted);max-width:36em}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.mini{background:var(--tag);border:0;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.mini h3{font-family:var(--font-display);font-size:21px;margin:0;line-height:1.15}
.mini p{margin:0;color:var(--muted);font-size:15px}
.mini .tags{margin-top:auto;padding-top:8px}
.case figure img{border:1px solid var(--rule);border-radius:18px;background:#fff}
.case .pair figure img{aspect-ratio:16/9;object-fit:cover}
@media (prefers-reduced-motion:reduce){.feature .shot img{transition:none}}
/* case study */
.case{padding-block:72px 0}
.case .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border-top:1px solid var(--fg);border-bottom:1px solid var(--rule);margin:8px 0 32px}
.case .meta div{padding:14px 12px 14px 0}
.case .meta b{display:block;font-weight:500;font-size:15px}
.case h3{font-family:var(--font-display);font-size:24px;letter-spacing:-.01em;margin:44px 0 10px;line-height:1.15}
.case p{max-width:40em;margin:0 0 14px}
.case ul.pts{max-width:40em;padding-left:18px;margin:0 0 14px}
.case ul.pts li{margin-bottom:6px}
.case figure{margin:24px 0 8px}
.case figure img{display:block;width:100%;height:auto;border-radius:4px;border:1px solid var(--rule)}
.case figcaption{font-size:14px;color:var(--muted);margin-top:8px;max-width:44em}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.pair figure{margin:24px 0 8px}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0}
.themes div{background:var(--tag);border-radius:14px;padding:16px 18px;font-size:15px}
.themes b{display:block;font-family:var(--font-display);font-size:17px;margin-bottom:4px}
blockquote{margin:18px 0;padding:4px 0 4px 18px;border-left:3px solid var(--accent);font-family:var(--font-display);font-size:clamp(20px,2.6vw,26px);line-height:1.25;max-width:30em}
.fix{width:100%;max-width:760px;border-collapse:collapse;font-size:15px;margin:12px 0}
.fix th,.fix td{text-align:left;vertical-align:top;padding:10px 12px 10px 0;border-top:1px solid var(--rule)}
.fix th{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
@media (max-width:640px){.fix,.fix tbody,.fix tr,.fix td,.fix th{display:block;width:100%}.fix thead{display:none}.fix td:first-child{font-weight:600;padding-bottom:0;border-top:1px solid var(--rule)}.fix td+td{border-top:0;padding-top:2px}}

@media (max-width:640px){
  .row{grid-template-columns:1fr}
  .hero{padding-block:36px 24px}
  .contact dl{grid-template-columns:1fr;gap:4px}
  .contact dd{margin-bottom:8px}
  .copy{justify-self:start;margin-bottom:12px}
}
@media (prefers-reduced-motion:reduce){.btn:hover{transform:none}}

.cs{padding-block:56px 0}
.list{list-style:none;margin:0;padding:0}

.stage{background:linear-gradient(160deg,#0b3d73,#0160AE);border-radius:24px;padding:clamp(24px,5vw,56px) 0 0;overflow:hidden;margin-bottom:14px}
.fan{display:flex;justify-content:center;align-items:flex-end;gap:clamp(8px,2vw,24px);padding-inline:16px}

.fan img{margin-bottom:-14%}
.rail{display:flex;gap:16px;overflow-x:auto;padding:28px clamp(16px,3vw,32px);scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.rail img{flex:0 0 auto;width:210px;height:auto;scroll-snap-align:start;filter:drop-shadow(0 12px 18px rgba(0,0,0,.28))}

.dark{background:radial-gradient(120% 120% at 20% 0%,#26262e,#121214);color:#fff;border-radius:24px;padding:clamp(28px,6vw,72px);margin-top:8px}

.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:40px}

.rs{background:#000;color:#fff;border-radius:28px;padding:clamp(20px,4vw,48px);margin-block:56px 0;overflow:hidden}
